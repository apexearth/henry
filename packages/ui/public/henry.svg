<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Henry, a bearded man in a slouch hat and flannel">
  <title>Henry</title>
  <!-- The same geometry as HenryMark.tsx, with the CSS fills inlined so it stands alone as the
       favicon and the app icon. Flat and geometric so the brim and the beard carry it at 16px. -->
  <defs>
    <clipPath id="h-card"><rect width="64" height="64" rx="14"/></clipPath>
    <path id="h-shirt" d="M4 64 L9.4 52.4 Q10.2 51 12 51 H52 Q53.8 51 54.6 52.4 L60 64 Z"/>
    <clipPath id="h-shirt-clip"><use href="#h-shirt"/></clipPath>
    <path id="h-crown" d="M20.6 20 L22.4 6.4 Q22.8 4 25.4 4 H38.6 Q41.2 4 41.6 6.4 L43.4 20 Z"/>
    <clipPath id="h-crown-clip"><use href="#h-crown"/></clipPath>
  </defs>
  <g clip-path="url(#h-card)">
    <rect width="64" height="64" fill="#161a21"/>

    <!-- Flannel shoulders, checked. -->
    <use href="#h-shirt" fill="#d97757"/>
    <g clip-path="url(#h-shirt-clip)" fill="#000" opacity=".15">
      <rect x="13" y="50" width="1.8" height="14"/><rect x="21" y="50" width="1.8" height="14"/>
      <rect x="30" y="50" width="1.8" height="14"/><rect x="39" y="50" width="1.8" height="14"/>
      <rect x="47" y="50" width="1.8" height="14"/>
      <rect x="2" y="54.5" width="60" height="1.8"/><rect x="2" y="60" width="60" height="1.8"/>
    </g>

    <!-- Head. The nose sits between the eyes and the mustache; the mustache lifts off the
         beard so the lower face doesn't read as one flat band. -->
    <rect x="16" y="24" width="32" height="16" rx="4" fill="#e8b98f"/>
    <rect x="30.6" y="29.8" width="2.8" height="6.6" rx="1.4" fill="#d79a6f"/>
    <rect x="21.6" y="27.2" width="6.4" height="7.2" rx="3.2" fill="#2b2118"/>
    <rect x="36" y="27.2" width="6.4" height="7.2" rx="3.2" fill="#2b2118"/>
    <path d="M13.6 36 H50.4 L45 52.4 Q32 59.6 19 52.4 Z" fill="#d8dde5"/>
    <rect x="28.4" y="39.4" width="7.2" height="3.6" rx="1.8" fill="#a2503c"/>
    <path d="M32 38.2 C30.2 36.4 26.4 36 24 37.8 C24.9 40.9 28.4 41.8 32 40.3 C35.6 41.8 39.1 40.9 40 37.8 C37.6 36 33.8 36.4 32 38.2 Z" fill="#f2f5f8"/>

    <!-- Slouch hat. -->
    <use href="#h-crown" fill="#6b4a2f"/>
    <g clip-path="url(#h-crown-clip)"><rect x="18" y="14" width="28" height="4.4" fill="#000" opacity=".37"/></g>
    <rect x="4" y="17.6" width="56" height="8" rx="4" fill="#6b4a2f"/>
  </g>
</svg>
